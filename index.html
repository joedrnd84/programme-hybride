:root{
  --bg:#0B0B0F;--surface:#16161B;--surface2:#212129;--ink:#FFFFFF;--muted:#A4A7B5;--line:#2A2A33;--soft:#212129;
  --blue:#142AF3;--acc:#8C97FF;--lift:#142AF3;--run:#FFFFFF;--rest:#C0C2B8;--ok:#9DF216;--race:#FF9F0A;
  --bar:rgba(22,22,27,.92);--glow:.45;
  --disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="light"]{
  --bg:#ECEEF7;--surface:#FFFFFF;--surface2:#E2E5F3;--ink:#0B0B0F;--muted:#5D6173;--line:#D8DBEB;--soft:#E2E5F3;
  --acc:#142AF3;--run:#0B0B0F;--rest:#B9BCC8;--ok:#9DF216;--bar:rgba(255,255,255,.94);--glow:.16;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-bottom:124px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body,button,summary,.card,.tabs,.days{touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
::selection{background:var(--blue);color:#fff}
p,li{text-wrap:pretty}
html{scrollbar-color:var(--surface2) var(--bg)}
.icn{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.k-lift{--cc:#FFFFFF}
.k-run{--cc:var(--bg)}
.k-rest{--cc:#0B0B0F}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:radial-gradient(100% 160% at 50% -50%,rgba(20,42,243,var(--glow)),transparent 70%),var(--bg);padding:14px 0 10px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-16px;height:16px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
.top .wrap{display:flex;align-items:center;gap:10px}
.top .wrap#strip{display:block}
.wk{flex:1;min-width:0}
.wk b{display:block;white-space:nowrap;font-family:var(--disp);font-style:italic;font-weight:800;font-size:clamp(28px,8vw,36px);line-height:.92;text-transform:uppercase;letter-spacing:.01em}
.wk span{display:block;font-size:12px;color:var(--muted);margin-top:5px}
.nav{display:flex;align-items:center;gap:8px}
.nav button{border:0;padding:0;font-weight:700}
.nav .theme{width:44px;height:44px;border-radius:50%;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center}
.nav .theme .icn{width:20px;height:20px}
.seg{display:flex;align-items:center;gap:2px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:4px}
.seg button{height:38px;min-width:38px;border-radius:999px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.seg button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.seg button:active:not(:disabled){background:var(--blue);color:#fff}
.seg button:disabled{opacity:.3}
.seg .today{background:var(--blue);color:#fff;padding:0 15px;font-family:var(--disp);font-style:italic;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.03em}

/* barre des jours */
.days{display:flex;gap:6px;margin:12px 0 2px}
.day{flex:1;min-width:0;height:66px;border-radius:999px;border:0;background:var(--surface2);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative;padding:0}
.day small{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day b{font-family:var(--disp);font-style:italic;font-weight:800;font-size:23px;line-height:1}
.day i{width:6px;height:6px;border-radius:50%;background:var(--dot,var(--c));margin-top:3px}
.day.k-lift{--dot:var(--acc)}
.day.on{flex:1.9;background:var(--c);color:var(--cc)}
.day.on small{color:var(--cc);opacity:.8}
.day.on i{background:var(--cc)}
.day.done{background:var(--ok);color:#04210F}
.day.done small{color:#04210F;opacity:.75}
.day.done i{background:#04210F}
.day.done b .icn{width:24px;height:24px;stroke-width:3}
.day.istoday{box-shadow:0 0 0 2px var(--ink)}

/* cartes */
main{padding-top:8px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:18px;margin:12px 0}
.card p{margin:6px 0}
.card ul{margin:6px 0;padding-left:20px}
.card li{margin:5px 0}
.muted{color:var(--muted)}
.meta{font-size:13px;color:var(--muted);margin:0}
.banner{background:var(--surface2);border-radius:20px;padding:12px 16px;margin-top:12px;font-size:13px}

/* carte héros */
.hero{border:0;overflow:hidden;background:var(--c);color:var(--cc);padding:22px 20px}
.hero>*{position:relative;z-index:1}
.hero::before{content:"";position:absolute;right:-46px;top:-56px;width:200px;height:200px;border-radius:50%;background:var(--cc);opacity:.1}
.hero h2{font-family:var(--disp);font-style:italic;font-weight:800;font-size:clamp(32px,10vw,42px);line-height:.95;text-transform:uppercase;margin:0 0 8px;letter-spacing:.01em;text-wrap:balance;max-width:14ch}
.hero .meta{color:inherit;opacity:.85;font-size:13.5px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pills span{background:rgba(127,127,127,.28);background:color-mix(in srgb,var(--cc) 18%,transparent);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600}
.bar{height:8px;background:rgba(127,127,127,.3);background:color-mix(in srgb,var(--cc) 22%,transparent);border-radius:8px;margin-top:16px;overflow:hidden}
.bar div{height:100%;background:var(--cc);width:0;border-radius:8px;transition:width .25s}
.km{font-family:var(--disp);font-style:italic;font-weight:800;font-size:116px;line-height:.85;margin-top:16px;letter-spacing:-.01em}
.km small{font-size:30px;margin-left:6px;opacity:.7}

details.warm{margin:12px 0}
details.warm summary{cursor:pointer;font-weight:600;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:22px;list-style:none}
details.warm summary::-webkit-details-marker{display:none}
details.warm[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
details.warm ul{margin:0;padding:12px 18px 12px 38px;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 22px 22px}
details.warm li{margin:4px 0}

/* exercices */
.ex .row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.ex h3{font-size:18px;font-weight:600;line-height:1.25;margin:2px 0 0}
.ex .n{font-family:var(--disp);font-style:italic;font-weight:800;color:var(--muted);font-size:26px;margin-right:8px}
.rx{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:10px;gap:6px 10px}
.rx .big{font-family:var(--disp);font-style:italic;font-weight:800;font-size:clamp(48px,15vw,64px);line-height:.9;white-space:nowrap}
.rx .load{font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.rest{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.sets{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px}
.set{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:transparent;font-family:var(--disp);font-style:italic;font-weight:800;font-size:23px;padding:0}
.set.d{background:var(--c);border-color:var(--c);color:var(--cc)}
.cue{font-size:13px;color:var(--muted);margin:8px 0 0}
.mg{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--cc);background:var(--c);border-radius:999px;padding:4px 13px 4px 9px;margin:10px 0 0}
.mg svg{display:block}
.mg .bd{fill:currentColor;opacity:.35}
.mg .hl{fill:currentColor}
.mg .sp{stroke:currentColor;stroke-width:1;fill:none;opacity:.6}
.mg .st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chk{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;flex:none;padding:0;display:flex;align-items:center;justify-content:center}
.chk .icn{width:22px;height:22px;stroke-width:3}
.chk.on{background:var(--ok);border-color:var(--ok);color:#04210F}
.ex.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.ex.ok .set.d{background:var(--ok);border-color:var(--ok);color:#04210F}

.step{padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0;padding-top:0}
.step b{display:block}

.finish{width:100%;border:0;border-radius:999px;min-height:62px;font-family:var(--disp);font-style:italic;font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.03em;background:var(--c);color:var(--cc);margin:10px 0 4px}
.finish.undo{background:var(--ok);color:#04210F}

/* listes */
.list .it{display:flex;gap:14px;align-items:center;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.list .it:first-child{border-top:0}
.list .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.list .it.done .dot{background:var(--ok)}
.list .t{flex:1;min-width:0}
.list .t b{display:block;font-weight:600}
.list .t span{font-size:13px;color:var(--muted)}
.list .r{font-family:var(--disp);font-style:italic;font-weight:800;font-size:22px;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:center;font-weight:600;padding-top:14px;border-top:2px solid var(--ink)}
.total span:last-child{font-family:var(--disp);font-style:italic;font-weight:800;font-size:26px}

.sec{font-family:var(--disp);font-style:italic;font-weight:800;text-transform:uppercase;font-size:26px;line-height:1;margin:0 0 8px;letter-spacing:.01em}

.ref{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.ref:first-of-type{border-top:0}
.ref .nm{flex:1;min-width:0;font-size:14px}
.ref .nm span{display:block;font-size:12px;color:var(--muted)}
.ref button{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2);font-size:20px;font-weight:700;padding:0}
.ref output{min-width:66px;text-align:center;font-weight:700}
.btn{border:0;background:var(--surface2);border-radius:999px;min-height:48px;padding:0 20px;font-weight:600;margin:8px 8px 0 0}

/* chrono */
.chrono{text-align:center;padding-top:8px}
.ct{font-family:var(--disp);font-style:italic;font-weight:800;font-size:clamp(64px,24vw,100px);white-space:nowrap;line-height:1;font-variant-numeric:tabular-nums;margin:30px 0 30px;letter-spacing:-.01em}
.cbtns{display:flex;justify-content:space-between;gap:16px;margin:0 6px}
.cb{width:104px;height:104px;border-radius:50%;border:0;font-family:var(--disp);font-style:italic;font-weight:800;font-size:25px;text-transform:uppercase;background:var(--surface2);color:var(--ink);padding:0;letter-spacing:.02em}
.cb:disabled{opacity:.4}
.cb.go{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.cb.pause{background:var(--ink);color:var(--bg)}
.cb svg{width:44px;height:44px;fill:currentColor;display:block;margin:0 auto}
details.tips summary{cursor:pointer;font-weight:600;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:22px;list-style:none;margin:12px 0}
details.tips summary::-webkit-details-marker{display:none}
.laps{margin-top:26px;text-align:left}
.lap{display:flex;justify-content:space-between;padding:13px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:17px}
.lap.best span:last-child{background:var(--ok);color:#04210F;border-radius:999px;padding:0 10px}
.lap.worst{color:#FF6B78}

/* minuteur de repos + barre d'onglets */
#timer{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:6;display:none}
#timer .box{max-width:520px;margin:0 auto;background:var(--blue);color:#fff;border-radius:999px;padding:8px 10px 8px 22px;display:flex;align-items:center;gap:8px;width:calc(100% - 24px);box-shadow:0 8px 20px rgba(0,0,0,.4)}
#timer .tm{font-family:var(--disp);font-style:italic;font-weight:800;font-size:30px;flex:1;text-transform:uppercase}
#timer button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:999px;min-height:40px;padding:0 15px;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs .in{pointer-events:auto;max-width:520px;margin:0 auto;display:flex;gap:4px;background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:38px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;border:0;background:transparent;color:var(--muted);border-radius:32px;font-size:11.5px;font-weight:600;padding:0}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:var(--blue);color:#fff}
.k-race{--cc:#0B0B0F}
.day.k-race:not(.on):not(.done){background:var(--race);color:#0B0B0F}
.day.k-race:not(.on):not(.done) small{color:#0B0B0F;opacity:.75}
.day.k-race:not(.on):not(.done) i{background:#0B0B0F}
.hero.k-race{background:linear-gradient(135deg,#FFB41F 0%,#FF8A00 100%)}
.exh{display:flex;gap:12px;align-items:flex-start}
.exm{flex:1;min-width:0}
.thumb{text-decoration:none;position:relative;flex:none;width:72px;height:72px;border-radius:20px;overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.thumb .ph{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.thumb .ph svg{width:26px;height:26px;fill:var(--ink)}
.thumb.has .ph{display:none}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .play{display:none;position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6)}
.thumb.has .play{display:block}
.thumb .play::before{content:"";position:absolute;left:9px;top:6px;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
.kmrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px}
.kmrow .km{margin-top:0}
.elev{flex:0 1 150px;min-width:96px;text-align:right;padding-bottom:6px}
.goal{margin:0 0 12px;font-size:13px}
.elev b{display:block;font-family:var(--disp);font-style:italic;font-weight:800;font-size:22px;line-height:1;margin-bottom:2px}
.elev svg{width:100%;height:auto;aspect-ratio:160/70;display:block;margin-left:auto;fill:none;stroke:var(--cc);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.elev .fill{fill:var(--cc);opacity:.14;stroke:none}
.wlnote{font-size:12px;color:var(--muted);margin:16px 8px 0}
@media (prefers-reduced-motion: reduce){.bar div{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="wk" id="wk"></div>
  <div class="nav">
    <button id="theme" class="theme" aria-label="Changer de thème"></button>
    <div class="seg">
      <button id="bprev" data-a="prev" aria-label="Semaine précédente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button data-a="today" class="today">Auj.</button>
      <button id="bnext" data-a="next" aria-label="Semaine suivante"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
</div><div class="wrap" id="strip"></div></header>
<div class="wrap"><main id="view"></main></div>
<div id="timer"><div class="box"><span class="tm" id="tm"></span><button data-a="t+">+30 s</button><button data-a="t0">Passer</button></div></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>

<script>
/* ---------- stockage ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let refs=store.get('hyb.refs',{}), log=store.get('hyb.log',{}), done=store.get('hyb.done',{});

/* ---------- calendrier ---------- */
const START=new Date(2026,9,12), WEEKS=33, DAY_MS=86400000;
const DN=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DF=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const BLOCKS=[
  {n:'Prépa course 20 km',from:1,to:4,col:'rest',goal:'Arriver frais et prêt le samedi 7 novembre : 20 km, D+ 700 m. Volume en hausse, puis affûtage.'},
  {n:'Construction',from:5,to:16,col:'lift',goal:'Monter les charges et le volume de course. Déficit modéré.'},
  {n:'Définition',from:17,to:33,col:'run',goal:'Garder la force, affiner la silhouette, finir sec en juin.'}
];
const blockOf=w=>w<=4?0:w<=16?1:2;
const isDl=w=>w%4===0||w===5;
const mult=w=>{const p=0.82+0.3*(1-Math.exp(-(w-1)/10));return isDl(w)?p*0.85:p};
const wkStart=w=>new Date(START.getFullYear(),START.getMonth(),START.getDate()+(w-1)*7);
const fd=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const fmt=n=>String(n).replace('.',',');
const rnd=(x,s)=>parseFloat((Math.round(x/s)*s).toFixed(1));
const half=x=>Math.round(x*2)/2;

/* ---------- séances de muscu ---------- */
const LIB={
bench:{n:'Développé couché barre',ref:65,step:2.5,unit:'bar',sets:[3,4,4],reps:['10','6–8','5–6'],rest:150,cue:'Omoplates serrées et basses, pieds ancrés. Descente en 3 s, puis pousse en pensant « rapprocher les coudes ». Les bras suivent, les pecs mènent.'},
incbar:{n:'Développé incliné barre',ref:50,step:2.5,unit:'bar',sets:[3,3,3],reps:['10','8–10','6–8'],rest:120,cue:'Banc à 30°, barre vers le haut des pecs. Descente en 3 s, coudes à 45°.'},
incdb:{n:'Développé incliné haltères',ref:24,step:2,unit:'db',sets:[3,3,3],reps:['10–12','8–10','8–10'],rest:90,cue:'Banc à 30°, coudes à 45°. Serre les pecs en haut sans verrouiller les coudes.'},
benchdb:{n:'Développé couché haltères',ref:24,step:2,unit:'db',sets:[3,3,4],reps:['10–12','8–10','8–10'],rest:120,cue:'Amplitude maxi, étire les pecs en bas. Les haltères se rejoignent sans se toucher.'},
floorpress:{n:'Développé au sol haltères',ref:22,step:2,unit:'db',sets:[3,3,3],reps:['10–12','10','8–10'],rest:90,cue:'Coudes à 45°, pause 1 s coudes au sol. Zéro élan, poitrine sortie.'},
cablepress:{n:'Développé poulie vis-à-vis',ref:12,step:2.5,unit:'cable',sets:[3,3,3],reps:['12','12','10–12'],rest:75,note:'par main',cue:'Debout, un pas devant l’autre. Pousse en serrant les pecs, bras en arc.'},
pushup:{n:'Pompes lentes',kind:'bw',sets:[3,3,4],reps:['8–12','12–15','15–20'],rest:75,cue:'Descente en 3 s, corps gainé comme une planche, poitrine au sol. Pense pecs.'},
pushupfeet:{n:'Pompes pieds surélevés',kind:'bw',sets:[3,3,3],reps:['8–10','10–12','12–15'],rest:75,cue:'Pieds sur un banc : tu charges le haut des pecs. Gainage serré.'},
fly:{n:'Écarté poulie vis-à-vis',ref:10,step:2.5,unit:'cable',sets:[2,3,3],reps:['12–15','12–15','12–15'],rest:60,note:'par côté',cue:'Bras légèrement fléchis et figés. Serre la poitrine comme pour presser un ballon.'},
lowfly:{n:'Écarté poulie basse',ref:8,step:2.5,unit:'cable',sets:[2,3,3],reps:['12–15','12–15','12'],rest:60,note:'par côté',cue:'Pars du bas, remonte vers le menton. Tu viens chercher le haut des pecs.'},
pecdeck:{n:'Pec deck',ref:40,step:5,unit:'mach',sets:[2,3,3],reps:['12–15','12','10–12'],rest:60,cue:'Dos plaqué, coudes à hauteur de poitrine. Pause 1 s en serrant.'},
flydb:{n:'Écarté incliné haltères',ref:12,step:2,unit:'db',sets:[2,3,3],reps:['12–15','10–12','10–12'],rest:75,cue:'Banc à 30°, coudes légèrement fléchis. Étire sans forcer en bas.'},
pullup:{n:'Tractions pronation',kind:'bw',sets:[3,4,4],reps:['5–8','6–10','6–10'],rest:120,cue:'Pars en abaissant les omoplates, coudes vers les poches. Pas d’élan. Trop dur ? Élastique ou tirage vertical.'},
pullneutral:{n:'Tractions prise neutre',kind:'bw',sets:[3,4,4],reps:['5–8','6–10','6–10'],rest:120,cue:'Paumes face à face. Poitrine vers la barre, coudes vers les hanches.'},
row:{n:'Rowing buste penché',ref:55,step:2.5,unit:'bar',sets:[3,3,3],reps:['10–12','8–10','8–10'],rest:90,cue:'Tire avec les coudes vers les hanches, pas avec les mains. Sangles autorisées : l’avant-bras ne doit pas lâcher avant le dos.'},
dbrow:{n:'Rowing haltère unilatéral',ref:26,step:2,unit:'one',sets:[3,3,3],reps:['10–12','8–10','8–10'],rest:90,note:'par bras',cue:'Main sur un banc, tire le coude vers la hanche. L’omoplate glisse, le buste ne tourne pas.'},
chestrow:{n:'Rowing poitrine appuyée',ref:20,step:2,unit:'db',sets:[3,3,3],reps:['12','10–12','10'],rest:90,cue:'Poitrine sur un banc incliné : zéro triche. Serre les omoplates en haut 1 s.'},
lat:{n:'Tirage vertical prise large',ref:36,step:2.5,unit:'cable',sets:[3,3,3],reps:['12','10–12','8–10'],rest:90,cue:'Tire la barre vers le haut de la poitrine, coudes vers le sol. Épaules basses.'},
crow:{n:'Tirage horizontal poulie',ref:50,step:2.5,unit:'cable',sets:[3,3,3],reps:['12','10–12','10–12'],rest:90,cue:'Poitrine sortie, tire vers le nombril. Pause 1 s coudes en arrière.'},
straightarm:{n:'Pull-over poulie bras tendus',ref:20,step:2.5,unit:'cable',sets:[2,3,3],reps:['12–15','12','12'],rest:60,cue:'Bras presque tendus, tire vers les cuisses avec les dorsaux. Ventre gainé.'},
facepull:{n:'Face pull',ref:18,step:2.5,unit:'cable',sets:[3,3,3],reps:['15','12–15','12–15'],rest:60,cue:'Corde au niveau du visage, tire vers le front, coudes hauts. Posture et épaules.'},
revfly:{n:'Oiseau haltères',ref:8,step:2,unit:'db',sets:[2,3,3],reps:['15','12–15','12–15'],rest:60,cue:'Buste penché, ouvre les bras comme des ailes. Léger et propre.'},
squat:{n:'Squat barre',ref:75,step:2.5,unit:'bar',sets:[3,4,4],reps:['10','6–8','5–6'],rest:180,cue:'Descente en 2–3 s, cuisses sous le parallèle, genoux dans l’axe des pieds. Gainage serré.'},
bulg:{n:'Fentes bulgares haltères',ref:14,step:2,unit:'db',sets:[2,3,3],reps:['8','8–10','8–10'],rest:90,note:'par jambe',cue:'Buste légèrement penché, genou avant stable. Descends lentement.'},
stepup:{n:'Step-ups haltères',ref:14,step:2,unit:'db',sets:[2,3,3],reps:['10','10','10'],rest:75,note:'par jambe',cue:'Box à hauteur de genou. Pousse avec la jambe du haut, pas d’élan avec l’autre.'},
lungewalk:{n:'Fentes marchées haltères',ref:14,step:2,unit:'db',sets:[2,3,3],reps:['10','10','12'],rest:90,note:'par jambe',cue:'Grands pas, genou avant stable, buste droit. Tu imites la foulée.'},
goblet:{n:'Squat goblet tempo',ref:24,step:2,unit:'one',sets:[3,3,3],reps:['10','10','8'],rest:75,cue:'3 s en descente, pause 1 s en bas, haltère contre la poitrine.'},
rdl:{n:'Soulevé de terre roumain',ref:70,step:2.5,unit:'bar',sets:[3,3,3],reps:['10','8–10','8'],rest:120,cue:'Hanches en arrière, barre collée aux jambes, dos neutre. Tu sens les ischios s’étirer.'},
hipthrust:{n:'Hip thrust barre',ref:80,step:2.5,unit:'bar',sets:[3,3,4],reps:['12','10','8–10'],rest:90,cue:'Dos sur un banc, menton rentré. Monte les hanches, serre les fessiers 1 s en haut.'},
deadlift:{n:'Soulevé de terre',ref:90,step:2.5,unit:'bar',sets:[3,3,3],reps:['8','5','3–5'],rest:180,cue:'Barre collée aux jambes, dos plat. Pousse le sol, hanches et épaules montent ensemble.'},
sldl:{n:'Soulevé de terre unilatéral',ref:14,step:2,unit:'db',sets:[2,3,3],reps:['8','8','8'],rest:75,note:'par jambe',cue:'Hanche en arrière, jambe libre tendue derrière. Équilibre = stabilité en course.'},
nordic:{n:'Nordic curl (négatif)',kind:'bw',sets:[2,3,3],reps:['4','5','6'],rest:90,cue:'Genoux calés, descends le plus lentement possible, rattrape-toi avec les mains. Ischios et tendons.'},
calf:{n:'Mollets debout, tempo lent',ref:20,step:2,unit:'db',sets:[3,4,4],reps:['15','12–15','12–15'],rest:60,cue:'3 s en montant, 1 s en haut, 3 s en descendant. C’est ton assurance tendons d’Achille.'},
calfsit:{n:'Mollets assis (soléaire)',ref:30,step:2.5,unit:'one',sets:[3,3,4],reps:['15','12–15','12–15'],rest:60,cue:'Charge sur les genoux, 3 s en montant et 3 s en descendant. Le soléaire est le moteur de ta foulée.'},
calfsl:{n:'Mollets unilatéraux',kind:'bw',sets:[2,3,3],reps:['10','12','12'],rest:60,note:'par jambe',cue:'Une jambe, main au mur. Amplitude complète, tempo lent.'},
calfiso:{n:'Isométrique mollets (Achille)',kind:'time',sets:[3,3,3],reps:['30 s','40 s','45 s'],rest:45,cue:'Monte sur la pointe des pieds et tiens la position haute, mollets contractés. L’isométrie renforce les tendons.'},
tib:{n:'Relevés de pointes (tibial)',kind:'bw',sets:[2,3,3],reps:['15','15','20'],rest:45,cue:'Dos au mur, talons à 30 cm. Relève les orteils. Ça protège tes tibias en course.'},
copen:{n:'Copenhagen plank',kind:'time',sets:[2,3,3],reps:['15 s','20 s','25 s'],rest:45,note:'par côté',cue:'Jambe du haut sur un banc, hanche haute. Adducteurs et bassin stables.'},
abduct:{n:'Marche latérale élastique',kind:'bw',sets:[2,3,3],reps:['12 pas','15 pas','15 pas'],rest:45,note:'par côté',cue:'Élastique aux genoux, bassin bas. Moyens fessiers : des hanches stables en course.'},
glutebridge:{n:'Pont fessier unilatéral',kind:'bw',sets:[2,3,3],reps:['10','12','12'],rest:45,note:'par jambe',cue:'Pied à plat, bassin à l’horizontale. Fessiers et ischios, bassin qui ne tombe pas.'},
stepdown:{n:'Step-down excentrique',kind:'bw',sets:[2,3,3],reps:['8','8','10'],rest:75,note:'par jambe',cue:'Debout sur un box, descends lentement (4 s) le talon opposé vers le sol, sans le poser. Tes quadriceps freinent comme en descente de trail.'},
airplane:{n:'Avion unipodal',kind:'bw',sets:[2,3,3],reps:['6','8','8'],rest:45,note:'par jambe',cue:'Sur une jambe, buste à l’horizontale, bras en croix. Hanche stable, bassin horizontal.'},
balance:{n:'Équilibre unipodal instable',kind:'time',sets:[2,3,3],reps:['30 s','40 s','45 s'],rest:30,note:'par jambe',cue:'Sur un coussin ou un bosu, genou souple. Les chevilles apprennent à stabiliser.'},
boxjump:{n:'Sauts sur box',kind:'plio',sets:[3,4,4],reps:['5','5','4'],rest:90,cue:'Frais, avant tout le reste. Réception silencieuse, genoux dans l’axe. Redescends en marchant.'},
squatjump:{n:'Squat jump',kind:'plio',sets:[3,4,4],reps:['5','5','6'],rest:90,cue:'Quart de squat, saute le plus haut possible. Réception souple et silencieuse.'},
splitjump:{n:'Fentes sautées',kind:'plio',sets:[3,3,3],reps:['6','8','8'],rest:90,note:'par jambe',cue:'Alterne les jambes en l’air. Réception contrôlée, buste droit.'},
hurdle:{n:'Sauts de haies enchaînés',kind:'plio',sets:[3,3,4],reps:['4','5','6'],rest:90,note:'haies de 30–40 cm',cue:'Pieds joints, rebondis vite entre les haies. Pas de pause entre deux sauts.'},
depth:{n:'Saut en contrebas puis rebond',kind:'plio',sets:[3,3,3],reps:['4','4','5'],rest:120,cue:'Descends d’un box bas (30 cm), rebondis tout de suite. Contact au sol très bref.'},
pogo:{n:'Rebonds sur place (pogo)',kind:'plio',sets:[3,3,4],reps:['20','25','30'],rest:60,cue:'Chevilles raides, contacts très courts, genoux presque tendus. Tendons réactifs.'},

function buildGym(title,dur,warm,ids,fids,extra){
  var ex=ids.map(function(id){return LIB[id]});
  var focus=(fids||ids).slice(0,3).map(function(id){var n=LIB[id].name;return n.charAt(0).toLowerCase()+n.slice(1)}).join(', ');
  return {title:title,dur:dur,warm:warm,focus:focus,goal:'Au programme : '+focus+'. '+(extra||''),ex:ex};
}
function specialGym(d,w){
  var c=w%4;
  if(d===2&&w>=6&&c===2)return buildGym('Jambes du coureur','55 min',['5 min de vélo, facile','Mobilité chevilles et hanches : 2 × 8 de chaque côté','Approche : 1 série légère de chaque mouvement'],['copen','revlunge','kbrdl','hipflex','calfw'],null,'Du travail unilatéral pour des jambes et des hanches qui encaissent le kilométrage.');
  if(d===4&&w>=7&&c===3)return buildGym('Kettlebell : core et hybride','50 min',['5 min de rameur','10 swings légers','5 respirations abdominales, côtes basses rentrées'],['swing','goblet','kbhalo','kbtrident','kblegs','kbscissors'],['kbhalo','kbtrident','kblegs'],'Circuit core : 5 tours de 10 répétitions, ou en EMOM 5 min (1 min par exercice).');
  if(d===4&&w>=9&&c===1)return buildGym('Obliques : circuits','50 min',['5 min de rameur','Rotations du buste : 2 × 10 de chaque côté','5 respirations abdominales, côtes basses rentrées'],['lat','pushupfeet','latbend','plankdip','hkwood','latdl','starfish','pendulum'],['latbend','plankdip','hkwood'],'Deux circuits de 2 tours, charge modérée : tu cherches les obliques, pas le dos.');
  return null;
}
function gymSession(d,w){
  var pg=prepGym(w,d);if(pg)return pg;
  var sg=specialGym(d,w);if(sg)return sg;
  var b=blockOf(w),used={},ids=[];
  function take(pool,o,s){
    for(var k=0;k<pool.length;k++){
      var id=pool[((w-1)*s+o+k)%pool.length];
      if(!used[id]){used[id]=1;ids.push(id);return}
    }
  }
  var pick;
  if(d===0){take(P.push,0,2);take(P.pull,1,1);take(P.pec,0,1);take(P.back,2,1);take(P.flex,1,2);take(P.anti,0,1);pick=[0,1,4]}
  else if(d===2){take(poolAt(PLIO_V,b),0,1);take(poolAt(PLIO_H,b),1,1);take(P.legQ,0,2);take(P.legP,1,2);take(P.acc1,0,1);take(P.acc2,2,1);take(P.rot,3,2);pick=[0,2,3]}
  else {take(P.power,0,1);take(P.pushC,1,1);take(P.pullC,0,1);take(P.flex,3,2);take(P.anti,2,2);take(P.rot,1,2);take(P.dyn,0,1);take(P.flex,0,3);pick=[0,3,4]}
  var focus=pick.map(function(i){var n=LIB[ids[i]].name;return n.charAt(0).toLowerCase()+n.slice(1)}).join(', ');
  var g=GYM[d];
  return {title:g.title,dur:g.dur,warm:g.warm,focus:focus,goal:'Au programme : '+focus+'.',ex:ids.map(function(id){return LIB[id]})};
}

function wakeOn(){try{if(navigator.wakeLock&&!WL){navigator.wakeLock.request('screen').then(function(l){WL=l;l.addEventListener('release',function(){WL=null})}).catch(function(){WL=null})}}catch(e){}}
function wakeOff(){try{if(WL){WL.release();WL=null}}catch(e){}}
function wakeSync(){var need=CH.run||(typeof tEnd!=='undefined'&&tEnd>Date.now());if(need)wakeOn();else wakeOff()}
function wlText(){return navigator.wakeLock?'L’écran reste allumé tant que le chrono tourne. Mets pause ou arrête pour le laisser se mettre en veille.':'Ton navigateur ne sait pas garder l’écran allumé : mets le verrouillage automatique du téléphone sur « Jamais » pendant ta séance.'}

function fmtMs(ms){var t=Math.floor(ms/10),cs=t%100,s=Math.floor(t/100)%60,m=Math.floor(t/6000);return (m<10?'0':'')+m+':'+(s<10?'0':'')+s+','+(cs<10?'0':'')+cs}

function chLapsHtml(){
  var L=CH.laps,cur=chEl(),times=[],i;
  for(i=0;i<L.length;i++)times.push(L[i]-(i?L[i-1]:0));
  var best=-1,worst=-1;
  if(times.length>1){best=times.indexOf(Math.min.apply(null,times));worst=times.indexOf(Math.max.apply(null,times))}
  var rows='';
  if(CH.run||CH.acc>0)rows+='<div class="lap"><span>Tour '+(L.length+1)+'</span><span id="cl">'+fmtMs(cur-(L.length?L[L.length-1]:0))+'</span></div>';
  for(i=times.length-1;i>=0;i--)rows+='<div class="lap'+(i===best?' best':i===worst?' worst':'')+'"><span>Tour '+(i+1)+'</span><span>'+fmtMs(times[i])+'</span></div>';
  return rows;
}

}

  document.getElementById('bprev').disabled=S.w<=1;document.getElementById('bnext').disabled=S.w>=WEEKS;
  document.getElementById('strip').innerHTML=S.tab==='session'?dayStrip():'';
  document.getElementById('tabs').innerHTML=[['session','Séance'],['week','Semaine'],['chrono','Chrono'],['set','Réglages']]
    .map(function(t){return '<button data-a="tab" data-v="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+TI[t[0]]+'<span>'+t[1]+'</span></button>'}).join('');
}
function raceDay(w,d){return w===4&&d===5}
const ICN={check:'<svg class="icn" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',sun:'<svg class="icn" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>',moon:'<svg class="icn" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
const IMG={miss:{},ok:{},off:false,fails:0};
function imgOk(el){IMG.ok[el.dataset.id]=el.getAttribute('src');IMG.fails=0;el.parentNode.classList.add('has')}
function imgFail(el){var n=(+el.dataset.n||0)+1,ext=['jpg','webp','png'];if(n<ext.length){el.dataset.n=n;el.src='img/'+el.dataset.id+'.'+ext[n]}else{IMG.miss[el.dataset.id]=1;if(++IMG.fails>=4&&!Object.keys(IMG.ok).length)IMG.off=true;el.remove()}}
function thumbHtml(ex){
  var q=encodeURIComponent(ex.name+' exercice technique');
  return '<a class="thumb" href="https://www.youtube.com/results?search_query='+q+'" target="_blank" rel="noopener" aria-label="Voir la démo : '+ex.name+'"><span class="ph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Démo</span>'+(IMG.off||IMG.miss[ex.id]?'':'<img src="'+(IMG.ok[ex.id]||'img/'+ex.id+'.jpg')+'" data-id="'+ex.id+'" data-n="0" alt="" loading="lazy" onload="imgOk(this)" onerror="imgFail(this)">')+'<i class="play"></i></a>';
}
const METT={'Pecs, dos et abdos':4.5,'Jambes : pliométrie et force spé course':5.5,'Abdos à fond et hybride':5,'Kettlebell : core et hybride':6,'Jambes du coureur':5,'Obliques : circuits':4.5,'Jambes spé trail : force et mollets':5};
function kcalRun(km,dp){return Math.round((KG*km+KG*0.0095*(dp||0))/10)*10}
function kcalGym(L){var m=parseInt(L.dur,10)||50,met=METT[L.title]||(m<=30?3.5:4.2);return Math.round(met*KG*m/60/10)*10}
function elevSvg(dp){
  var h=Math.max(8,Math.round(52*Math.min(dp,700)/700)),p='',i,n=26,t,x,y;
  for(i=0;i<=n;i++){t=i/n;x=6+148*t;y=64-h*t-(t>0&&t<1?Math.sin(t*14)*Math.min(5,2+h/12):0);p+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
  return '<svg viewBox="0 0 160 70" aria-hidden="true"><path class="fill" d="'+p+'L154 66L6 66Z"/><path d="'+p+'"/></svg>';
}
function dayStrip(){
  const tk=todayKey(),s0=wkStart(S.w);
  return '<div class="days">'+DN.map(function(n,i){
    const dt=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+i).getDate();
    return '<button class="day k-'+(raceDay(S.w,i)?'race':kindOf(i))+(S.d===i?' on':'')+(done[S.w+'-'+i]?' done':'')+(tk===S.w+'-'+i?' istoday':'')+'" style="--c:'+colOf(i)+'" data-a="day" data-d="'+i+'" aria-label="'+DF[i]+' '+dt+(done[S.w+'-'+i]?', séance validée':'')+'" aria-pressed="'+(S.d===i)+'"'+(tk===S.w+'-'+i?' aria-current="date"':'')+'><small>'+n+'</small><b>'+(done[S.w+'-'+i]?ICN.check:dt)+'</b><i></i></button>';
  }).join('')+'</div>';
}
function renderSession(){
  const d=S.d,w=S.w,c=colOf(d),key=w+'-'+d,race=raceDay(w,d),kc='k-'+(race?'race':kindOf(d));
  let h='';
  if(S.pre) h+='<div class="banner">Le programme démarre <b>lundi 12 octobre</b>. Voici la première séance.</div>';
  if(isDl(w)) h+='<div class="banner">Semaine allégée : une série en moins, charges −15\u00a0%. Tu récupères.</div>';
  if(d===6){
    const Rr=restInfo(w),kr=Math.round(3.5*KG*0.5/10)*10;
    h+='<div class="card hero '+kc+'" style="--c:'+c+'"><h2>Repos actif</h2><p class="meta">'+Rr.goal+'</p><div class="pills"><span>≈ '+kr+' kcal</span></div></div><div class="card"><div class="step"><b>'+Rr.a.h+'</b>'+Rr.a.t+'</div><div class="step"><b>'+Rr.m.h+'</b>'+Rr.m.t+'</div><p class="muted">Dors 7–8 h. C’est la séance la plus rentable de la semaine.</p></div>';
    return h+finishBtn(key,c);
  }
  if(LIFT[d]){
    const L=gymSession(d,w);let tot=0,dn=0;
    const exs=L.ex.map(function(ex){return {ex:ex,n:setsOf(ex,w)}}).filter(function(o){return o.n>0});
    exs.forEach(function(o){tot+=o.n;dn+=(log[w+'-'+d+'-'+o.ex.id]||[]).slice(0,o.n).filter(Boolean).length});
    h+='<div class="card hero '+kc+'" style="--c:'+c+'"><h2>'+L.title+'</h2><p class="meta">'+L.goal+'</p><div class="pills"><span>'+L.dur+'</span><span>'+exs.length+' exercices</span><span>'+tot+' séries</span><span>≈ '+kcalGym(L)+' kcal</span></div><div class="bar"><div style="width:'+(tot?Math.round(dn/tot*100):0)+'%"></div></div></div>';
    h+='<details class="warm"><summary>Échauffement (5–8 min)</summary><ul>'+L.warm.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></details>';
    exs.forEach(function(o,i){
      const ex=o.ex,n=o.n,arr=log[w+'-'+d+'-'+ex.id]||[];
      const rep=ex.reps[blockOf(w)];
      const rx=ex.rounds?n+' tours':n+' × '+rep;
      const load=ex.rounds?'':loadText(ex,w);
      const okEx=!!log[w+'-'+d+'-'+ex.id+'!'];
      let sets='';
      for(let k=0;k<n;k++)sets+='<button class="set '+(arr[k]?'d':'')+'" data-a="set" data-id="'+ex.id+'" data-i="'+k+'" data-sec="'+ex.rest+'" data-n="'+n+'" aria-label="Série '+(k+1)+'">'+(k+1)+'</button>';
      h+='<div class="card ex '+kc+(okEx?' ok':'')+'" style="--c:'+c+'"><div class="exh">'+thumbHtml(ex)+'<div class="exm"><h3><span class="n">'+(i+1)+'</span>'+ex.name+'</h3>'+mgChip(ex.g)+'</div><button class="chk '+(okEx?'on':'')+'" data-a="exdone" data-id="'+ex.id+'" aria-pressed="'+okEx+'" aria-label="Exercice terminé">'+ICN.check+'</button></div><div class="rx"><span class="big">'+rx+'</span>'+(load?'<span class="load">'+load+'</span>':'')+'</div><p class="rest">'+(ex.rounds?rep+'. ':'')+(ex.note?ex.note+'. ':'')+'Repos '+restTxt(ex.rest)+'</p><div class="sets">'+sets+'</div><p class="cue">'+ex.cue+'</p></div>';
    });
    return h+finishBtn(key,c);
  }
  const R=runInfo(d,w),dp=R.dplus||0;
  h+='<div class="card hero '+kc+'" style="--c:'+c+'"><h2>'+R.title+'</h2><div class="kmrow"><div class="km">'+fmt(R.km)+'<small>km</small></div>'+(dp>0?'<div class="elev"><b>'+dp+'\u00a0m D+</b>'+elevSvg(dp)+'</div>':'')+'</div><div class="pills"><span>'+R.dur+'</span><span>≈\u00a0'+kcalRun(R.km,dp)+'\u00a0kcal</span></div></div><div class="card"><p class="muted goal">'+R.goal+'</p>'+R.steps.map(function(s){return '<div class="step"><b>'+s.h+'</b>'+s.t+'</div>'}).join('')+'</div>';
  return h+finishBtn(key,c);
}
function finishBtn(key,c){
  const kc='k-'+(raceDay(S.w,S.d)?'race':kindOf(S.d));
  return done[key]?'<button class="finish undo '+kc+'" style="--c:'+c+'" data-a="done">Annuler</button>':'<button class="finish '+kc+'" style="--c:'+c+'" data-a="done">Valider la séance</button>';
}
function renderWeek(){
  const w=S.w;
  let h='<div class="card list">'+DN.map(function(n,i){
    const k=kindOf(i);
    const right=k==='run'?fmt(runInfo(i,w).km)+' km':k==='lift'?gymSession(i,w).dur:'30 min';
    return '<button class="it k-'+(raceDay(w,i)?'race':k)+(done[w+'-'+i]?' done':'')+'" style="--c:'+colOf(i)+'" data-a="open" data-d="'+i+'"><span class="dot"></span><span class="t"><b>'+DF[i]+'</b><span>'+dayTitle(i,w)+(done[w+'-'+i]?' · validée':'')+'</span></span><span class="r">'+right+'</span></button>';
  }).join('')+'<div class="total"><span>Course sur la semaine</span><span>'+fmt(weekKm(w))+' km</span></div></div>';
  h+='<div class="card"><p class="muted">Vise 3 séances de muscu, 3 sorties, 1 jour de repos. Une séance ratée ne se rattrape pas : on saute et on continue.</p></div>';
  return h;
}
function renderRules(){
  const sec=function(t,b){return '<div class="card"><h3 class="sec">'+t+'</h3>'+b+'</div>'};
  return sec('Course du 7 novembre : 20 km, D+ 700 m','<ul><li>Objectif réaliste : finir bien, en 2 h 30–2 h 50.</li><li>Départ prudent : les 5 premiers km doivent te sembler trop faciles.</li><li>Marche dès que la pente dépasse 10 % : c’est une stratégie, pas un échec.</li><li>Descentes : foulées courtes, pieds sous le bassin, regard 3 m devant.</li><li>30–40 g de glucides par heure dès 40 min, 400–500 ml d’eau par heure.</li><li>Veille et matin : repas léger et pauvre en fibres, toilettes avant le départ.</li><li>Rien de nouveau le jour J : chaussures, tenue et gels déjà testés.</li><li>Douleur qui augmente en courant (genou, tibia, tendon) : tu marches ou tu t’arrêtes.</li></ul>')
  +sec('Lire une séance','<p>Les charges sont calculées pour la semaine en cours. Finis chaque série avec 1 à 3 répétitions en réserve.</p><p>Trop facile ou trop lourd ? Ajuste la charge de référence dans Réglages.</p>')
  +sec('Semaines allégées','<p>S4, S8, S12… : une série en moins, charges −15 %. Tu récupères, tu repars plus fort.</p>')
  +sec('Pecs sans bras','<ul><li>Pousser : omoplates serrées, coudes à 45°, pense « rapprocher les coudes ».</li><li>Tirer : coudes vers les hanches, sangles si l’avant-bras lâche avant le dos.</li><li>Aucune séance bras : ils travaillent déjà assez.</li></ul>')
  +sec('Pliométrie et tendons','<ul><li>Pliométrie en début de séance, toujours frais, jamais à froid.</li><li>Mollets lents, step-ups, fentes : ta protection pour la course.</li><li>Un tendon qui tire plus de 48 h : allège la semaine suivante. Si ça persiste, vois un pro.</li></ul>')
  +sec('Course','<ul><li>Facile : tu tiens une conversation (≈ 125–145 bpm).</li><li>Rapide : 2–3 mots maximum.</li><li>Allure 5 km : ce que tu tiendrais 20–25 min. Allure 10 km : un cran en dessous.</li><li>Pas de montre ? L’effort ressenti suffit.</li></ul>')
  +sec('Souplesse : la base (jeudi et dimanche proposent une routine différente chaque semaine)','<ul><li>Fente basse + rotation du buste : 2 × 6 par côté</li><li>Position 90/90 des hanches : 2 × 8 par côté</li><li>Ischios : 2 × 40 s par jambe</li><li>Grand écart facial assisté : 2 × 45 s</li><li>Chevilles, genou au mur : 2 × 10 par côté</li><li>Open book thoracique : 2 × 8 par côté</li></ul>')
  +sec('Nutrition','<ul><li>Protéines : 150–165 g par jour.</li><li>Semaines 1–4 : mange à la maintenance (≈ 2 700 kcal, estimation).</li><li>À partir de S5 : ≈ 300–400 kcal en dessous, soit ≈ 2 400 kcal. Perte visée : 0,3 à 0,5 kg par semaine.</li><li>Pèse-toi 3 matins par semaine, regarde la moyenne. Ajuste de 100–150 kcal si ça stagne 2 semaines.</li><li>Tour de taille et photos toutes les 2 semaines : plus fiables que la balance seule.</li><li>10–12 % se tient mieux à 12 %. 10 % est un pic, pas un état permanent.</li></ul>')
  +sec('Le bas du ventre','<p>Il part avec le déficit et la course, pas avec les abdos. Les abdos servent à ta force et à ta posture.</p>')
  +sec('Machine prise ?','<ul><li>Squat barre → presse + fentes marchées</li><li>Développé couché → haltères à plat</li><li>Tractions → tirage vertical, prise large</li><li>Box jumps → squat jumps</li></ul>');
}
function renderSet(){
  const all=[];Object.keys(LIB).forEach(function(k){if(!LIB[k].kind)all.push(LIB[k])});
  let h='<div class="card"><h3 class="sec">Mon poids</h3><p class="muted">Sert à estimer les calories de chaque séance (MET × poids × durée pour la muscu, poids × distance + dénivelé pour la course).</p><div class="ref"><div class="nm"><b>Poids du corps</b></div><button data-a="kg" data-dir="-1" aria-label="Moins">−</button><output>'+fmt(KG)+' kg</output><button data-a="kg" data-dir="1" aria-label="Plus">+</button></div></div><div class="card"><h3 class="sec">Charges de référence</h3><p class="muted">Ta charge de travail « normale ». Le plan l’adapte chaque semaine. Ajuste dès que c’est trop facile ou trop lourd.</p>'
  +all.map(function(ex){const v=refs[ex.id]!==undefined?refs[ex.id]:ex.ref;return '<div class="ref"><div class="nm"><b>'+ex.name+'</b><span>'+(UNITLAB[ex.unit]||'barre incluse')+'</span></div><button data-a="ref" data-k="'+ex.id+'" data-dir="-1" data-s="'+ex.step+'" aria-label="Moins">−</button><output>'+fmt(v)+' kg</output><button data-a="ref" data-k="'+ex.id+'" data-dir="1" data-s="'+ex.step+'" aria-label="Plus">+</button></div>'}).join('')
  +'<button class="btn" data-a="resetrefs">'+(S.confirm==='refs'?'Confirmer la remise à zéro':'Remettre les valeurs de départ')+'</button></div>';
  h+='<div class="card"><h3 class="sec">Suivi</h3><p class="muted">Séries cochées et séances validées sont gardées sur cet appareil.</p><button class="btn" data-a="resetlog">'+(S.confirm==='log'?'Confirmer l’effacement':'Effacer le suivi')+'</button></div>';
  return h;
}
function render(){
  const y=window.scrollY;head();
  document.getElementById('view').innerHTML=({session:renderSession,week:renderWeek,chrono:renderChrono,set:function(){return '<details class="tips"><summary>Conseils : course, nutrition, règles</summary>'+renderRules()+'</details>'+renderSet()}})[S.tab]();
  window.scrollTo(0,y);
}


/* ---------- minuteur ---------- */
let tEnd=0,tInt=null;
function startRest(sec){tEnd=Date.now()+sec*1000;document.getElementById('timer').style.display='block';if(!tInt)tInt=setInterval(tick,250);tick()}
function stopRest(){clearInterval(tInt);tInt=null;tEnd=0;document.getElementById('timer').style.display='none';wakeSync()}
function tick(){
  const left=Math.ceil((tEnd-Date.now())/1000);
  if(left<=0){try{navigator.vibrate&&navigator.vibrate(250)}catch(e){}stopRest();return}
  document.getElementById('tm').textContent='Repos '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='tab'){S.tab=t.dataset.v;S.confirm='';window.scrollTo(0,0)}
  else if(a==='prev'){S.w=Math.max(1,S.w-1)}
  else if(a==='next'){S.w=Math.min(WEEKS,S.w+1)}
  else if(a==='today'){const tk=todayKey();if(tk){const [w,d]=tk.split('-').map(Number);S.w=w;S.d=d}else{S.w=now<START?1:WEEKS;S.d=0}S.tab='session'}
  else if(a==='day'){S.d=+t.dataset.d}
  else if(a==='open'){S.d=+t.dataset.d;S.tab='session';window.scrollTo(0,0)}
  else if(a==='goweek'){S.w=+t.dataset.w;S.tab='week';window.scrollTo(0,0)}
  else if(a==='set'){
    const key=`${S.w}-${S.d}-${t.dataset.id}`,arr=log[key]||[],i=+t.dataset.i,nn=+t.dataset.n;
    arr[i]=!arr[i];log[key]=arr;
    const all=arr.slice(0,nn).filter(Boolean).length===nn;
    if(all)log[key+'!']=true;
    store.set('hyb.log',log);
    if(arr[i]&&!all)startRest(+t.dataset.sec);
  }
  else if(a==='exdone'){const k2=S.w+'-'+S.d+'-'+t.dataset.id+'!';log[k2]=!log[k2];store.set('hyb.log',log)}
  else if(a==='chgo'){if(CH.run){CH.acc+=Date.now()-CH.start;CH.run=false}else{CH.start=Date.now();CH.run=true}chSave()}
  else if(a==='chlap'){if(CH.run){CH.laps.push(chEl())}else{CH={run:false,start:0,acc:0,laps:[]}}chSave()}
  else if(a==='done'){const k=`${S.w}-${S.d}`;if(done[k])delete done[k];else done[k]=true;store.set('hyb.done',done)}
  else if(a==='ref'){const k=t.dataset.k;const ex=LIB[k];const cur=refs[k]??ex.ref;refs[k]=Math.max(0,rnd(cur+t.dataset.dir*t.dataset.s,0.5));store.set('hyb.refs',refs)}
  else if(a==='resetrefs'){if(S.confirm==='refs'){refs={};store.set('hyb.refs',refs);S.confirm=''}else S.confirm='refs'}
  else if(a==='resetlog'){if(S.confirm==='log'){log={};done={};store.set('hyb.log',log);store.set('hyb.done',done);S.confirm=''}else S.confirm='log'}
  else if(a==='kg'){KG=Math.max(40,Math.min(150,Math.round((KG+(+t.dataset.dir)*0.5)*10)/10));store.set('hyb.kg',KG)}
  else if(a==='t+'){tEnd+=30000;tick();return}
  else if(a==='t0'){stopRest();return}
  wakeSync();render();
});

/* ---------- thème clair / sombre ---------- */
const root=document.documentElement, tbtn=document.getElementById('theme');
const sysDark=()=>window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
const curTheme=()=>root.getAttribute('data-theme')||(sysDark()?'dark':'light');
function paintTheme(){
  const d=curTheme()==='dark';
  tbtn.innerHTML=d?ICN.sun:ICN.moon;
  tbtn.setAttribute('aria-label',d?'Passer en mode clair':'Passer en mode sombre');
}
tbtn.addEventListener('click',()=>{
  const n=curTheme()==='dark'?'light':'dark';
  root.setAttribute('data-theme',n);store.set('hyb.theme',n);paintTheme();
});
paintTheme();
wakeSync();
render();
</script>
</body>
</html>
